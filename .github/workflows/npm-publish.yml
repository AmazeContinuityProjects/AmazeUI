name: Publish to NPM

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate package exports (publint + attw)
        run: pnpm pkg:check
      - name: Upgrade npm CLI for OIDC trusted publishing
        # OIDC-based publishing requires npm >= 11.5.1. Runner toolchains can
        # bundle older npm versions even on Node 24, so upgrade explicitly.
        run: |
          npm --version
          npm install -g npm@latest
      - name: Publish via OIDC trusted publishing
        # pnpm publish delegates to the npm CLI, which exchanges the GitHub
        # Actions OIDC token automatically. No NPM_TOKEN secret is used or
        # needed.
        run: pnpm publish --access public --no-git-checks
